[server]
# Replace with the receiver device's LAN/VPN address.
url = "http://192.168.1.33:4489"
token = "dev-secret-change-me"
timeout_secs = 30

[capture]
device_id = "desktop-one"
# Set an explicit index after running `list-monitors`, or omit it to prefer the primary display.
# monitor_index = 0
prefer_primary = true
format = "png"
jpeg_quality = 90
interval_ms = 1000
send_unchanged = false

# Optional crop, relative to the selected monitor.
# [capture.region]
# x = 100
# y = 100
# width = 1200
# height = 800
